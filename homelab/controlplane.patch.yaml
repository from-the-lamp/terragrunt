# Talos machine config patch for the homelab single-node bare-metal cluster
# (UM890 Pro mini PC, 64GB RAM). Feed this to `talosctl gen config` as
# --config-patch, same role as hetzner/talos's generated config_patches
# (see _common/talos/machine_configuration.hcl) - NOT wired into Terragrunt
# like hetzner/prod-0/1 are, because there's no cloud resource to create
# here: the node is physical hardware, not something Terraform provisions.
# See README.md in this directory for the full bootstrap runbook.
#
# Every PLACEHOLDER below must be replaced before `talosctl apply-config`.
machine:
  network:
    hostname: homelab
    interfaces:
      - interface: eth0 # PLACEHOLDER - real interface name (`talosctl get links` after boot, or ip link on the installer shell)
        addresses:
          - 192.168.1.50/24 # PLACEHOLDER - a free static IP in your LAN
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1 # PLACEHOLDER - your router's LAN IP
  kubelet:
    nodeIP:
      validSubnets:
        - 192.168.1.0/24 # PLACEHOLDER - your LAN subnet
    extraConfig:
      # Same OOM-protection mechanism as Hetzner's (see
      # _common/talos/machine_configuration.hcl's comment for why), just
      # loosened: those thresholds were sized for 16GB nodes, this one has
      # 64GB. Revisit once real workload numbers exist.
      systemReserved:
        cpu: 250m
        memory: 1Gi
      kubeReserved:
        cpu: 250m
        memory: 1Gi
      evictionHard:
        memory.available: 1Gi
      evictionSoft:
        memory.available: 1.5Gi
      evictionSoftGracePeriod:
        memory.available: 1m30s
cluster:
  allowSchedulingOnControlPlanes: true
  apiServer:
    extraArgs:
      anonymous-auth: "true"
  etcd:
    advertisedSubnets:
      - 192.168.1.0/24 # PLACEHOLDER - same LAN subnet as above
  # The one load-bearing difference from Hetzner's own patch: no
  # hcloud-cloud-controller-manager exists here to initialize the node, so
  # kubelet must NOT run with --cloud-provider=external, or it waits
  # forever for a CCM that will never show up.
  externalCloudProvider:
    enabled: false
  network:
    # Same as Hetzner: Talos's bundled Flannel is disabled, Cilium is
    # installed separately via Helm instead, for parity with the rest of
    # this org's clusters (see homelab/README.md's bootstrap steps).
    cni:
      name: none
    # NOT the same ranges as Hetzner (172.20.0.0/16 pods / 172.21.0.0/16
    # services) - this node joins the SAME tailnet as Hetzner, and two
    # nodes can't advertise the same route. 172.24/172.25 is the next
    # free-looking block but is NOT verified against oracle-prod-0/1 or
    # anything else already advertised - check the Tailscale admin console
    # (Machines -> routes) before first apply. If it collides, change this
    # together with infra/argo-apps's apps/homelab/platform (istio-system's
    # ClusterIP, coredns's zone file, tailscale's advertiseRoutes - search
    # that tree for "172.24" / "172.25").
    podSubnets:
      - 172.24.0.0/16
    serviceSubnets:
      - 172.25.0.0/16
