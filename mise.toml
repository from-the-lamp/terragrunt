[tools]
task = "3.54.0"
opentofu = "1.13.2"
terragrunt = "1.2.1"
kubectl = "1.37.1"
# Keep in sync with homelab/env.hcl's talos_version — a mismatched talosctl
# (even a newer one) silently fails some RPCs (get/logs/dmesg) against an
# older Talos server while others (services) keep working, which reads as
# random flakiness instead of a version mismatch.
talosctl = "1.14.2"
jq = "1.8.2"
oras = "1.3.6"
vault = "2.2.1"
# For local dev only - pinned so a human's local run matches this version.
# .docker/Dockerfile deliberately does NOT install this one via mise: on
# Alpine (musl) mise's python core plugin has no prebuilt binary and falls
# back to compiling CPython from source, needing a full build toolchain for
# a script (.docker/changed_units.py) that's stdlib-only and gains nothing
# from this exact version - the image uses apk's python3 instead.
python = "3.14.4"

[hooks]
postinstall = '''
set -uo pipefail
# No-op in CI (including this repo's own .docker/Dockerfile, which sets
# CI=true for exactly this) - the .env bootstrap below is for a human's
# first local clone, meaningless inside a throwaway image build.
if [ -n "${CI:-}" ]; then
  exit 0
fi
if [ ! -f .env ]; then
  cp .env.example .env
  echo "mise: created .env from .env.example - fill in the secrets before running terragrunt"
fi
for var in TF_HTTP_PASSWORD HETZNER_API_TOKEN; do
  if ! grep -q "^${var}=..*" .env 2>/dev/null; then
    echo "mise: warning - ${var} is not set in .env"
  fi
done
'''
