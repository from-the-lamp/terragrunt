version: '3'

silent: true

vars:
  HOMELAB_DIR: "{{.ROOT_DIR}}/homelab"
  GEN_DIR: "{{.ROOT_DIR}}/homelab/_generated"
  TALOS_VERSION:
    sh: grep -E '^\s*talos_version\s*=' "{{.ROOT_DIR}}/homelab/env.hcl" | sed -E 's/.*"(.*)".*/\1/'
  LAN_GATEWAY:
    sh: grep -E '^\s*lan_gateway\s*=' "{{.ROOT_DIR}}/homelab/env.hcl" | sed -E 's/.*"(.*)".*/\1/'
  # env.hcl's own list syntax (["siderolabs/amd-ucode"]) is already valid
  # JSON - read it here instead of hardcoding below, so there's one source
  # of truth for which extensions get baked into the schematic (same reason
  # TALOS_VERSION/LAN_GATEWAY are read this way instead of duplicated).
  TALOS_EXTENSIONS_JSON:
    sh: grep -E '^\s*talos_extensions\s*=' "{{.ROOT_DIR}}/homelab/env.hcl" | sed -E 's/.*=\s*(\[.*\])\s*$/\1/'
  # The GL.iNet router's own SSH - override if it's not root/default LAN IP,
  # e.g. `task homelab:publish-config ROUTER_SSH=admin@192.168.8.1`.
  ROUTER_SSH: 'root@{{.LAN_GATEWAY}}'

tasks:

  homelab:schematic:
    desc: Register the homelab Image Factory schematic (extensions from env.hcl + talos.config fetched from the router)
    cmds:
    - |
      set -euo pipefail
      body=$(jq -n \
        --argjson exts '{{.TALOS_EXTENSIONS_JSON}}' \
        --arg karg "talos.config=http://{{.LAN_GATEWAY}}/config.yaml" \
        '{customization:{extraKernelArgs:[$karg],systemExtensions:{officialExtensions:$exts}}}')
      curl -sS -X POST -H "Content-Type: application/json" -d "$body" \
        https://factory.talos.dev/schematics | jq -r '.id'

  homelab:boot-iso:
    desc: Download the homelab boot ISO (installer; fetches its config from the router at boot) to homelab/_generated/boot.iso
    cmds:
    - mkdir -p "{{.GEN_DIR}}"
    - |
      set -euo pipefail
      schematic=$(task homelab:schematic)
      echo "schematic: $schematic (talos {{.TALOS_VERSION}})"
      curl -sSL -o "{{.GEN_DIR}}/boot.iso" \
        "https://factory.talos.dev/image/${schematic}/{{.TALOS_VERSION}}/metal-amd64.iso"
      echo "wrote {{.GEN_DIR}}/boot.iso"

  homelab:config:
    desc: Render node-1's machine config (requires talos/secrets and talos/machine_config/node-1 already applied) to homelab/_generated/config.yaml
    cmds:
    - mkdir -p "{{.GEN_DIR}}"
    - |
      set -euo pipefail
      cd "{{.HOMELAB_DIR}}/talos/machine_config/node-1"
      terragrunt output -raw machine_configuration > "{{.GEN_DIR}}/config.yaml"
      chmod 600 "{{.GEN_DIR}}/config.yaml"
      echo "wrote {{.GEN_DIR}}/config.yaml (contains real cluster secrets - never commit this)"

  homelab:publish-config:
    desc: 'Upload config.yaml to the GL.iNet router''s web root (uhttpd serves /www as-is) so the node can fetch it over the LAN at boot'
    deps: [homelab:config]
    cmds:
    - |
      set -euo pipefail
      scp "{{.GEN_DIR}}/config.yaml" "{{.ROUTER_SSH}}:/www/config.yaml"
      echo "published: http://{{.LAN_GATEWAY}}/config.yaml"
      echo "run 'task homelab:unpublish-config' once the node has bootstrapped - it carries real cluster secrets, don't leave it serving indefinitely"

  homelab:unpublish-config:
    desc: Remove config.yaml from the router once the node has successfully fetched and bootstrapped from it
    cmds:
    - |
      set -euo pipefail
      ssh "{{.ROUTER_SSH}}" 'rm -f /www/config.yaml'
      echo "removed from {{.ROUTER_SSH}}:/www/config.yaml"

  homelab:flash:
    desc: 'dd homelab/_generated/boot.iso to a USB stick. Usage: task homelab:flash DEVICE=/dev/sdX'
    vars:
      IMG: "{{.GEN_DIR}}/boot.iso"
    preconditions:
    - sh: test -n "{{.DEVICE}}"
      msg: "DEVICE is required, e.g. DEVICE=/dev/sdX (Linux) or DEVICE=/dev/rdiskN (macOS) - run lsblk/diskutil list first to find it"
    - sh: test -f "{{.IMG}}"
      msg: "{{.IMG}} doesn't exist yet - run `task homelab:boot-iso` first"
    cmds:
    - |
      set -euo pipefail
      # Retyping the device path only catches fumble-fingers, not
      # misreading which device is which in the lsblk table below - these
      # two checks catch the cases that actually matter: writing over
      # something currently mounted, or over the disk macOS/Linux itself
      # booted from.
      boot_disk=""
      if command -v findmnt >/dev/null 2>&1; then
        root_src=$(findmnt -no SOURCE / 2>/dev/null || true)
        [ -n "$root_src" ] && boot_disk=$(lsblk -no PKNAME "$root_src" 2>/dev/null || true)
      fi
      if [ -n "$boot_disk" ] && [ "{{.DEVICE}}" = "/dev/$boot_disk" ]; then
        echo "{{.DEVICE}} is this machine's own boot disk - refusing to touch it." >&2
        exit 1
      fi
      if (mount 2>/dev/null | grep -q "^{{.DEVICE}}"); then
        echo "{{.DEVICE}} (or a partition on it) is currently mounted - unmount it first." >&2
        exit 1
      fi
      echo "About to overwrite {{.DEVICE}} entirely with {{.IMG}}."
      echo "--- current block devices ---"
      (lsblk 2>/dev/null || diskutil list 2>/dev/null) | sed 's/^/  /'
      echo "------------------------------"
      read -r -p "Type the device path again to confirm ({{.DEVICE}}): " confirm
      if [ "$confirm" != "{{.DEVICE}}" ]; then
        echo "Confirmation didn't match - aborting, nothing written." >&2
        exit 1
      fi
      sudo dd if="{{.IMG}}" of="{{.DEVICE}}" bs=4M status=progress conv=fsync
      sync
      echo "done"
