version: '3'

env:
  OCI_CONFIG_PATH: "{{.HOME}}/.oci/config"

silent: true
tasks:
  .terragrunt:
    internal: true
    dir: $DIR
    cmds:
    - |
      terragrunt {{ .ACTION }} \
        -compact-warnings --all \
        --log-level {{.LOG_LEVEL}} \
        {{.CLI_ARGS}} {{ .ADDITION_ARGS }}

  plan:
    desc: Run plan for all modules in subdirectories
    cmds:
    - task: .terragrunt
      vars: {
        ACTION: "plan",
      }

  apply:
    desc: Run apply for all modules in subdirectories
    cmds:
    - task: .terragrunt
      vars: {
        ACTION: "apply",
      }

  destroy:
    desc: Run destroy for all modules in subdirectories
    cmds:
    - task: .terragrunt
      vars: {
        ACTION: "destroy",
      }

  validate:
    desc: Run validate for all modules in subdirectories
    cmds:
    - task: .terragrunt
      vars: {
        ACTION: "validate",
      }

  outputs:
    desc: Show module outputs
    cmds:
    - task: .terragrunt
      vars: {
        ACTION: "output",
      }

  list:changed:
    desc: List units changed since DIFF_BASE (direct changes + transitive HCL readers, including root/env configs). Override with TARGETS="dir1 dir2".
    cmd: echo {{.CHANGED_UNITS}} | tr ' ' '\n'
    preconditions:
      - sh: '[ -n "{{.CHANGED_UNITS}}" ]'
        msg: "No changed units found."

  plan:changed:
    desc: Run plan for every changed unit (see list:changed). A no-op (not a failure) when nothing changed - an MR touching no terragrunt unit is a normal case for the CI plan job, not an error.
    cmds:
    - |
      set -e
      if [ -z "{{.CHANGED_UNITS}}" ]; then
        echo "no changed units - nothing to plan"
        exit 0
      fi
      for d in {{.CHANGED_UNITS}}; do
        echo -e "\033[36m== plan: $d ==\033[0m"
        (cd "$d" && terragrunt plan --log-level {{.LOG_LEVEL}})
      done

  apply:changed:
    desc: Run apply for every changed unit (see list:changed). Auto-approves only when $CI is set - prompts interactively otherwise. A no-op (not a failure) when nothing changed.
    cmds:
    - |
      set -e
      if [ -z "{{.CHANGED_UNITS}}" ]; then
        echo "no changed units - nothing to apply"
        exit 0
      fi
      approve_flag=""
      [ -n "${CI:-}" ] && approve_flag="-auto-approve"
      for d in {{.CHANGED_UNITS}}; do
        echo -e "\033[36m== apply: $d ==\033[0m"
        (cd "$d" && terragrunt apply $approve_flag --log-level {{.LOG_LEVEL}})
      done

  comment:plan:
    desc: 'Post a file''s content as a GitLab MR note (no-op outside a merge_request_event pipeline). Usage: FILE=<path> task comment:plan'
    cmds:
    - |
      set -euo pipefail
      if [ -z "${CI_MERGE_REQUEST_IID:-}" ]; then
        echo "not an MR pipeline, skipping comment"
        exit 0
      fi
      test -n "{{.FILE}}" || { echo "FILE is required, e.g. FILE=plan_output.txt" >&2; exit 1; }
      # One line on purpose - a YAML block scalar can't hold a line less-indented
      # than its own first line, which rules out unindented (i.e. valid) multi-line
      # Python nested in here. GitLab note bodies have a size limit well above
      # 50000 chars - truncated from the front so the end of a terragrunt run survives.
      body=$(python3 -c "import json,sys; text=open(sys.argv[1],encoding='utf-8',errors='replace').read(); print(json.dumps('\`\`\`\n'+text[-50000:]+'\n\`\`\`'))" "{{.FILE}}")
      # GITLAB_API_TOKEN, not TF_HTTP_PASSWORD: CI_JOB_TOKEN can only read MR
      # notes (GET), never create one (POST) - confirmed against GitLab's
      # own job-token fine-grained-permissions docs, not assumed.
      curl -sf -H "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" -H "Content-Type: application/json" \
        -d "{\"body\": ${body}}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes" >/dev/null
      echo -e "\033[32m==>\033[0m posted {{.FILE}} to MR !${CI_MERGE_REQUEST_IID}"

  unlock:
    dir: $DIR
    desc: Unlock state by ID
    cmds:
      - terragrunt force-unlock {{ .CLI_ARGS }}

  import:
    dir: $DIR
    desc: 'Import an existing resource into a single unit''s state. Usage: DIR=<unit dir> ADDRESS=<resource address> ID=<import id> task import'
    cmds:
      - |
        set -euo pipefail
        test -n "{{.ADDRESS}}" && test -n "{{.ID}}" || { echo "ADDRESS and ID are both required, e.g. ADDRESS=gitlab_project.this ID=from-the-lamp/infra/helm-charts" >&2; exit 1; }
        terragrunt import "{{.ADDRESS}}" "{{.ID}}" --log-level {{.LOG_LEVEL}}

  migrate-state:
    desc: Migrate state (usually required during project initialization)
    dir: $DIR
    cmds:
    - task: .terragrunt
      vars: {
        ACTION: "init",
        ADDITION_ARGS: "-migrate-state -input=true"
      }

  fmt:
    desc: Format all HCL code
    cmds:
    - terragrunt hcl format
