version: "3"

dotenv: [".env"]
vars:
  LOG_LEVEL: info
  DIFF_BASE:
    sh: |
      if [ -n "${DIFF_BASE:-}" ]; then
        echo "$DIFF_BASE"
        exit 0
      fi
      for c in "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-}" "${CI_COMMIT_BEFORE_SHA:-}"; do
        if [ -n "$c" ] && [ "$c" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$c^{commit}" 2>/dev/null; then
          echo "$c"
          exit 0
        fi
      done
      echo HEAD~1
  CHANGED_UNITS:
    sh: |
      set -eu
      if [ -n "${TARGETS:-}" ]; then
        echo "$TARGETS"
        exit 0
      fi
      units=$(python3 .docker/changed_units.py --diff-base "{{.DIFF_BASE}}")
      printf '%s\n' "$units" | tr '\n' ' '

includes:
  custom:
    taskfile: .tasks/custom.yml
    flatten: true
    optional: true
  init:
    taskfile: .tasks/init.yml
    flatten: true
  terragrunt:
    taskfile: .tasks/terragrunt.yml
    flatten: true
  homelab:
    taskfile: .tasks/homelab.yml
    flatten: true
  vault:
    taskfile: .tasks/vault.yml
    flatten: true

silent: true
tasks:

  default:
    desc: List all available tasks
    cmd: task --list-all

  test:changed-units:
    desc: Test changed-unit selection offline, without credentials or infrastructure access
    cmd: python3 -B -m unittest discover -s tests -p 'test_changed_units.py'

  auth:
    desc: Log in to the GitLab container registry that serves the oci:// module sources
    cmds:
    # GITLAB_API_TOKEN, not TF_HTTP_PASSWORD - these pulls are cross-project
    # (helm charts / terraform modules, published by OTHER projects), a
    # same-project CI_JOB_TOKEN would not be accepted.
    - echo -e "\033[36m==>\033[0m logging in to registry.gitlab.com - terragrunt and tofu pull oci:// modules with the credentials oras stores"
    - echo "${GITLAB_API_TOKEN}" | oras login -u gitlab-token --password-stdin registry.gitlab.com

  cleanup:
    desc: Remove temporary files
    cmds:
    - find . -type d -name ".terragrunt-cache" -prune -exec rm -rf {} \;
    - find . -type d -name ".terraform" -prune -exec rm -rf {} \;
    - find . -iname "*generated*" -delete;
    - find . -iname ".helmignore" -delete;
    - find . -iname ".terraform.lock.hcl" -delete;
